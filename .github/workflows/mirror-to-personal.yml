name: Mirror Organization Dev to Personal Main

on:
  push:
    branches:
      - Develop

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Organization Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Needed to push changes

      - name: Configure Git
        run: |
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global user.name "ripper-jc"

      - name: Mirror to Personal Repo
        run: |
          git remote add personal "https://${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/ripper-jc/tomodachi-hub.git"
          git push personal Develop:main --force
